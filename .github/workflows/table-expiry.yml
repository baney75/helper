name: SNAP table expiry

# Fails when the newest SNAP fiscal-year table in src/data/fpl.ts ends within
# 30 days (or already ended). A failed scheduled run emails the repo owner.

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/check-table-expiry.mjs
      - src/data/fpl.ts
      - .github/workflows/table-expiry.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-table-expiry.mjs
